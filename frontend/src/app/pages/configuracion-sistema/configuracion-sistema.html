<mat-toolbar color="primary">
  <button mat-button (click)="volver()">⬅ Volver</button>
  <span style="flex: 1; text-align: center">CONFIGURACIÓN DEL SISTEMA</span>
</mat-toolbar>

<div class="productos-container">

  <!-- HEADER -->
  <header class="header-section">
    <div class="header-title-container">
      <h2>⚙️ Configuración General</h2>
    </div>

    <div class="header-actions-container" *ngIf="!editando">
      <button class="btn-base btn-edit" (click)="activarEdicion()">
        <mat-icon>edit</mat-icon>
        Editar configuración
      </button>
    </div>
  </header>

  <!-- =========================
       FORM (USED FOR BOTH MODES)
  ========================== -->
  <div class="config-form-card">

    <form [formGroup]="configForm" class="vertical-form">

      <!-- EMPRESA -->
      <div class="form-group">
        <label>
          <mat-icon>business</mat-icon>
          Nombre de Empresa
        </label>

        <input
          type="text"
          formControlName="empresaNombre"
          [readonly]="!editando"
        />
      </div>

      <!-- DIRECCIÓN -->
      <div class="form-group">
        <label>
          <mat-icon>location_on</mat-icon>
          Dirección
        </label>

        <input
          type="text"
          formControlName="empresaDireccion"
          [readonly]="!editando"
        />
      </div>

      <!-- RUN -->
      <div class="form-group split">

        <div>
          <label>
            <mat-icon>tag</mat-icon>
            RUN
          </label>

          <input
            type="text"
            formControlName="empresaRun"
            [readonly]="!editando"
          />
        </div>

        <div>
          <label>DV</label>

          <input
            type="text"
            formControlName="empresaDV"
            maxlength="1"
            [readonly]="!editando"
          />
        </div>

      </div>

      <!-- IVA -->
      <div class="form-group">
        <label>
          <mat-icon>percent</mat-icon>
          IVA (%)
        </label>

        <input
          type="number"
          formControlName="iva"
          min="0"
          max="100"
          [readonly]="!editando"
        />

        <!-- 🔴 VALIDATION ERROR -->
        <div class="field-error"
             *ngIf="editando && ivaControl?.invalid && ivaControl?.touched">

          <span *ngIf="ivaControl?.errors?.['required']">
            El IVA es obligatorio
          </span>

          <span *ngIf="ivaControl?.errors?.['min']">
            El IVA no puede ser menor a 0
          </span>

          <span *ngIf="ivaControl?.errors?.['max']">
            El IVA no puede ser mayor a 100
          </span>

        </div>
      </div>

    </form>

  </div>

  <!-- =========================
       ACTIONS
  ========================== -->
  <div class="form-actions" *ngIf="editando">

    <button class="btn-base btn-cancel" type="button" (click)="cancelarEdicion()">
      Cancelar
    </button>

    <button
      class="btn-base btn-save"
      type="button"
      (click)="guardar()"
      [disabled]="configForm.invalid || loading"
    >
      <mat-icon>save</mat-icon>
      Guardar
    </button>

  </div>

</div>
