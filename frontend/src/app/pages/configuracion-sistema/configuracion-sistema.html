<mat-toolbar color="primary">
  <button mat-button (click)="volver()">⬅ Volver</button>
  <span style="flex: 1; text-align: center">CONFIGURACIÓN DEL SISTEMA</span>
</mat-toolbar>

<div class="productos-container">

  <!-- HEADER -->
  <header class="header-section">
    <div class="header-title-container">
      <h2>⚙️ Configuración General</h2>
    </div>

    <!-- EDIT BUTTON (ONLY IN VIEW MODE) -->
    <div class="header-actions-container" *ngIf="!editando">
      <button class="btn-base btn-edit" (click)="activarEdicion()">
        <mat-icon>edit</mat-icon>
        Editar configuración
      </button>
    </div>
  </header>

  <!-- =========================
       VIEW MODE
  ========================== -->
  <div class="config-view-card" *ngIf="!editando">

    <div class="config-row">
      <mat-icon>business</mat-icon>
      <div>
        <label>Empresa</label>
        <span>{{ configForm.value.empresaNombre }}</span>
      </div>
    </div>

    <div class="config-row">
      <mat-icon>location_on</mat-icon>
      <div>
        <label>Dirección</label>
        <span>{{ configForm.value.empresaDireccion }}</span>
      </div>
    </div>

    <div class="config-row split">
      <div>
        <mat-icon>tag</mat-icon>
        <label>RUN</label>
        <span>{{ configForm.value.empresaRun }}-{{ configForm.value.empresaDV }}</span>
      </div>

      <div>
        <mat-icon>percent</mat-icon>
        <label>IVA</label>
        <span>{{ configForm.value.iva }}%</span>
      </div>
    </div>

  </div>

  <!-- =========================
       EDIT MODE
  ========================== -->
  <div class="config-form-card" *ngIf="editando">

    <form [formGroup]="configForm" class="vertical-form">

      <!-- EMPRESA -->
      <div class="form-group">
        <label>
          <mat-icon>business</mat-icon>
          Nombre de Empresa
        </label>
        <input type="text" formControlName="empresaNombre" />
      </div>

      <!-- DIRECCIÓN -->
      <div class="form-group">
        <label>
          <mat-icon>location_on</mat-icon>
          Dirección
        </label>
        <input type="text" formControlName="empresaDireccion" />
      </div>

      <!-- RUN -->
      <div class="form-group split">

        <div>
          <label>
            <mat-icon>tag</mat-icon>
            RUN
          </label>
          <input type="text" formControlName="empresaRun" />
        </div>

        <div>
          <label>DV</label>
          <input type="text" formControlName="empresaDV" maxlength="1" />
        </div>

      </div>

      <!-- IVA -->
      <div class="form-group">
        <label>
          <mat-icon>percent</mat-icon>
          IVA (%)
        </label>
        <input type="number" formControlName="iva" min="0" max="100" />
      </div>

    </form>

  </div>

  <!-- =========================
       ACTIONS (ONLY EDIT MODE)
  ========================== -->
  <div class="form-actions" *ngIf="editando">

    <button class="btn-base btn-cancel" type="button" (click)="cancelarEdicion()">
      Cancelar
    </button>

    <button
      class="btn-base btn-save"
      type="button"
      (click)="guardar()"
      [disabled]="configForm.invalid || loading"
    >
      <mat-icon>save</mat-icon>
      Guardar
    </button>

  </div>

</div>
