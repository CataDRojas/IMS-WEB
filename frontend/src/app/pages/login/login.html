<div class="login-container">
  <mat-card class="login-card">
    
    <div class="logo-container">
      <img src="/imagenes/banner-ims.png" alt="IMS Logo" class="login-logo">
    </div>

    <mat-card-header>
      <mat-card-title>Iniciar Sesión</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form class="login-form" (ngSubmit)="iniciarSesion()">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario / Correo</mat-label>
          <input matInput type="email" name="email" [(ngModel)]="credenciales.email" 
                 placeholder="ejemplo@empresa.com" required>
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" name="password" [(ngModel)]="credenciales.password" 
                 placeholder="Ingresa tu contraseña" required>
          <mat-icon matSuffix>lock</mat-icon>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="btn-login">
          Iniciar sesión
        </button>
        
      </form>
    </mat-card-content>
  </mat-card>
</div>
