<form class="login-form" (ngSubmit)="iniciarSesion()">
      
      <div class="form-group">
        <label for="email">Usuario / Correo</label>
        <input type="text" id="email" name="email" [(ngModel)]="credenciales.email" placeholder="ejemplo@empresa.com" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="credenciales.password" placeholder="Ingresa tu contraseña" required>
      </div>

      <button type="submit" class="btn-login">Iniciar Sesión</button>
      
    </form>
