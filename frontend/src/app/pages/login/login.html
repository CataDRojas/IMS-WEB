<form class="login-form" (ngSubmit)="iniciarSesion()" #form="ngForm">

  <!-- 🔴 GLOBAL ERROR -->
  <div *ngIf="errorMessage" class="error-box">
    {{ errorMessage }}
  </div>

  <div class="form-group">
    <label for="email">Usuario / Correo</label>
    <input
      type="text"
      id="email"
      name="email"
      [(ngModel)]="credenciales.email"
      placeholder="ejemplo@empresa.com"
      required
      #emailModel="ngModel"
    />

    <div class="field-error" *ngIf="emailModel.invalid && emailModel.touched">
      El correo es obligatorio
    </div>
  </div>

  <div class="form-group">
    <label for="password">Contraseña</label>
    <input
      type="password"
      id="password"
      name="password"
      [(ngModel)]="credenciales.password"
      placeholder="Ingresa tu contraseña"
      required
      #passwordModel="ngModel"
    />

    <div class="field-error" *ngIf="passwordModel.invalid && passwordModel.touched">
      La contraseña es obligatoria
    </div>
  </div>

  <button
    type="submit"
    class="btn-login"
    [disabled]="form.invalid"
  >
    Iniciar Sesión
  </button>

</form>
